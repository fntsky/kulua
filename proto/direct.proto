// Kulua direct UDP 协议 —— 唯一事实来源。
//
// kulua-server（phone）↔ daemon / fusion-viewer（PC）直接通信的线协议。
// 每个 UDP datagram 恰好是一个 Frame（protobuf 二进制），datagram 边界即消息边界。
// 用 protoc 生成 Java（--java_out=lite），用 prost-build 生成 Rust。
//
// 可靠性与分片语义见 docs/direct-udp-protocol.md。

syntax = "proto3";

package kulua.direct;

// Java 每个 message 一个文件，便于 javac/d8 处理。
option java_multiple_files = true;
option java_package = "kulua.direct";

// 数据报外层（仅 control 端口 P 使用）。
//
// 音频/视频已迁出到独立 UDP 端口（video=P+1 / audio=P+2），用 33B 大端定长
// 二进制头承载（非 protobuf），手机端独立 socket 收发：
//
//   offset  size  field
//   0       4     client_id  （HELLO_ACK 分配，phone 按它路由媒体分片）
//   4       4     msg_id     （一条媒体帧一个 id，分片共享）
//   8       4     seq        （每流单调递增，排序/去重用）
//   12      2     frag       （分片索引，0 起）
//   14      2     frag_total （0 = 单包完整；0xFFFF = OPEN 注册包，负载为空）
//   16      8     pts        （微秒；接收侧以 frag==0 的值为准）
//   24      8     revision   （音频代次，= 产生本帧的采集器对应的 SetAudio.revision；
//                              视频恒 0；接收侧只接受当前代次，避免旧音频串入新播放）
//   32      1     flags      （bit0=config bit1=keyframe）
//
// WHY：单端口单 socket 时音视频分片共享发送缓冲（视频关键帧突发挤掉音频），
// 且手机 ctrl 单循环要给每个媒体分片跑 protobuf 解析。分端口后三路流缓冲
// 独立、媒体路径零 protobuf。PC 在媒体端口发 OPEN（携 client_id）注册接收
// 端点；phone 收到任何校验通过的数据报即把源地址登记为发送目标。
// config 帧（SPS/PPS 等）仍走 control 端口可靠投递（MediaConfig）。
message Frame {
  // control 端口上只剩控制流（媒体已迁出，AUDIO=1/VIDEO=2 仅作为
  // 媒体端口/ MediaConfig.stream 的流标识保留数值）。
  enum Stream {
    CTRL = 0;
  }

  // 帧类型。
  enum Type {
    DATA = 0;       // control 负载（重装后为 CtrlMsg，可靠）
    ACK = 1;        // control 累积确认（不回 seq，天然抗丢）
    HELLO = 2;      // PC → phone：打开会话（携带 scid）
    HELLO_ACK = 3;  // phone → PC：回执（携带 codec 状态 + client_id）
    HEARTBEAT = 4;  // PC → phone 保活（也用于 NAT 映射保鲜）
    BYE = 5;        // 关闭会话
  }

  Stream stream = 1;
  Type type = 2;
  // control 单调递增序号：ACK/去重/窗口滑动用。
  uint32 seq = 3;
  // 分片归属：同一消息的所有分片共享一个 msg_id（配合 frag/frag_total 重装）。
  uint32 msg_id = 4;
  // 分片索引（0 起）；单包完整消息 = 0。
  uint32 frag = 5;
  // 总分片数（0 表示单包完整；分片消息首片给出真实总数）。
  uint32 frag_total = 6;

  // 7/8 为旧媒体字段（media_pts/media_flags）占位，媒体已迁出到媒体端口，
  // 不复用以避免新旧实现歧义。
  reserved 7, 8;

  oneof payload {
    // control DATA 负载（可靠流，重装后为 CtrlMsg）。
    bytes data = 10;
    // ACK：确认到该序号（含）。
    uint32 ack_seq = 12;
    Hello hello = 13;
    HelloAck hello_ack = 14;
  }
}

// 会话打开请求（PC → phone）。scid 用于会话隔离（与 kill_by_scid 对齐）。
message Hello {
  string scid = 1; // 8 位小写 hex（如 "4b4c6a2f"），须与 phone 自身一致
  bool audio = 2;  // 请求音频流（daemon=true；fusion-viewer=false）
}

// 会话打开回执（phone → PC）。
message HelloAck {
  string scid = 1;            // 回显
  uint32 audio_codec = 2;     // 音频 codec id（0=禁用 / 4B ASCII id，如 "opus"）
  uint32 video_codec = 3;     // 视频 codec id（"h264"）；未创建显示器时可不填
  // phone 分配的客户端 id（1 起单调递增）；媒体端口数据报头携带，
  // phone 按它把媒体分片路由到本会话、并把数据报源地址登记为媒体发送目标。
  uint32 client_id = 4;
}

// 所有 control 命令 / 服务器事件（可靠 DATA 的负载）。
message CtrlMsg {
  oneof msg {
    // ── PC → phone：输入注入 / 剪贴板 / 显示器管理 ──
    InjectKeycode inject_keycode = 1;
    InjectText inject_text = 2;
    InjectTouch inject_touch = 3;
    InjectScroll inject_scroll = 4;
    BackOrScreenOn back_or_screen_on = 5;
    SetClipboard set_clipboard = 6;
    StartApp start_app = 7;
    ResizeDisplay resize_display = 8;
    CreateDisplay create_display = 9;
    DestroyDisplay destroy_display = 10;

    // ── PC → phone：配置 ──
    SetAudio set_audio = 31; // 音频开关 + 编码（一条命令，避免快速修改状态不一致）

    // ── phone → PC：剪贴板 / 确认 / 握手结果 ──
    ClipboardChanged clipboard_changed = 21;
    AckClipboard ack_clipboard = 22;
    MediaConfig media_config = 23;     // 音频/视频 config 帧（可靠投递）
    AudioState audio_state = 32;       // 音频启停/编码切换的业务回执
    DisplayReady display_ready = 25;   // 视频显示器创建结果
  }

  // 24/30：旧 AudioReady / SetAudioCodec（已被 AudioState / SetAudio 取代）。
  reserved 24, 30;
}

// 音频开关 + 编码一起下发（PC → phone）。
//
// WHY 合并成一条：开关与编码分开下发时，快速连续修改会出现「先按旧 codec 起采集、
// 再按新 codec 重起」的中间态；revision 让 PC 能丢弃旧代次的音频。
// 关闭不能用 codec=0 表达（0 已经表示 raw）。
message SetAudio {
  bool enabled = 1;     // 期望状态
  uint32 codec = 2;     // 期望编码索引：0=raw 1=opus 2=aac 3=flac（enabled=false 时仅记录）
  uint64 revision = 3;  // 本次目标代次；phone 用同一值标记媒体帧 / MediaConfig / AudioState
}

// 音频/视频 config 帧（AAC AudioSpecificConfig / FLAC STREAMINFO / H.264 SPS+PPS）。
// 走可靠 control 流，确保解码器可在首帧前初始化。
message MediaConfig {
  uint32 stream = 1; // 流标识：1=AUDIO 2=VIDEO（与媒体端口序 video=P+1/audio=P+2 对应）
  bytes data = 2;    // config 原始字节（同原 12B 帧头 bit62 携带的内容）
  uint64 revision = 3; // 音频代次（= SetAudio.revision；视频恒 0）
}

// 音频状态回执（phone → PC）：传输层 ACK 只代表命令已收到，业务是否落地看这里。
//
// phone 在两种时机发送：切换执行完成（成功或失败），以及采集自愈后的恢复。
message AudioState {
  uint64 revision = 1; // 回显 SetAudio.revision
  bool enabled = 2;    // 实际是否在采集
  uint32 codec_id = 3; // 实际 codec（4B ASCII id，如 "aac"；0=未启用）
  string error = 4;    // 非空 = 本次启用失败（采集器/编码器不可用）
}

message InjectKeycode {
  uint32 display_id = 1; // 0 = 实体屏，>0 = 虚拟显示器（server 内部 id）
  uint32 action = 2;     // KeyEvent.ACTION_DOWN/UP
  uint32 keycode = 3;    // android.view.KeyEvent.KEYCODE_*
  uint32 repeat = 4;
  uint32 meta_state = 5; // KeyEvent.getMetaState()
}

message InjectText {
  uint32 display_id = 1;
  string text = 2;       // UTF-8
}

message InjectTouch {
  uint32 display_id = 1;
  uint32 action = 2;                // MotionEvent.ACTION_*
  uint64 pointer_id = 3;            // scrcpy 约定：u64::MAX = 鼠标
  sint32 x = 4;                     // 设备物理像素坐标
  sint32 y = 5;
  uint32 screen_width = 6;          // 当前视频分辨率（压力归一化用）
  uint32 screen_height = 7;
  float pressure = 8;               // 0.0 ~ 1.0（原 u16 定点换算为 float）
  uint32 action_button = 9;
  uint32 buttons = 10;
}

message InjectScroll {
  uint32 display_id = 1;
  sint32 x = 2;
  sint32 y = 3;
  uint32 screen_width = 4;
  uint32 screen_height = 5;
  float hscroll = 6;               // 滚动量（像素），-16..16
  float vscroll = 7;
  uint32 buttons = 8;
}

message BackOrScreenOn {
  uint32 display_id = 1;
  uint32 action = 2;
}

message SetClipboard {
  uint64 sequence = 1;
  bool paste = 2;
  string text = 3;
}

message StartApp {
  uint32 display_id = 1;
  string package = 2;
}

message ResizeDisplay {
  uint32 display_id = 1;
  uint32 width = 2;
  uint32 height = 3;
}

message CreateDisplay {
  uint32 width = 1;
  uint32 height = 2;
  uint32 dpi = 3;
}

message DestroyDisplay {
  uint32 display_id = 1;
}

// ── phone → PC ──

message ClipboardChanged {
  string text = 1;
}

message AckClipboard {
  uint64 sequence = 1;
}

// 视频显示器创建完成（server → PC viewer）。
message DisplayReady {
  uint32 display_id = 1;   // server 内部显示器 id（注入/RESIZE/START_APP 用）
  uint32 codec_id = 2;     // 4B ASCII（"h264"）
  uint32 width = 3;        // 实际创建尺寸
  uint32 height = 4;
  uint32 dpi = 5;
}
