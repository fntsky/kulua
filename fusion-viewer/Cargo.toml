[package]
name = "fusion-viewer"
version = "0.1.0"
edition = "2024"

# 自研 scrcpy 客户端：eframe/egui 窗口 + FFmpeg 软解 + 自研控制协议注入。
# 不依赖官方 scrcpy.exe；运行时复用 dist 中的 avcodec-62.dll / avutil-60.dll。
# egui 提供窗口/输入/文本渲染，视频帧以纹理呈现 + HUD 调试面板（码率/帧率/丢包率）。

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
# 仅 avcodec（avutil 为隐式依赖；YUV→RGB 手写转换，不需要 swscale）
ffmpeg-sys-next = { version = "7", default-features = false, features = ["avcodec"] }
md-5 = "0.10"
kulua-proto = { path = "../kulua-proto" }
