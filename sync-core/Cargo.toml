[package]
name = "sync-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52", features = ["full"] }
rqrr = "0.8"
image = "0.25"
rand = "0.8"
qrcode = "0.14"
mdns-sd = "0.10"
clipboard-win = "5.4"
notify-rust = "4.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
thiserror = "2"
tokio-stream = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["codec"] }
opus = "0.3"
rodio = "0.22"

uuid = { version = "1", features = ["serde", "v4"] }