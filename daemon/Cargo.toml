[package]
name = "daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
# Linux 不需要 muda 的 libxdo（xdotool）：自定菜单项（打开/退出）走 GTK 即可，
# 关闭默认 feature 省掉 xdotool 系统依赖
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
sync-core = { path = "../sync-core" }
image = "0.25"
ctrlc = "3.4"
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Console"] }

# Linux 托盘：泵 GTK 主循环让 libappindicator 显示图标（见 main.rs setup_tray_icon）
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
